<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Website - Banking Module</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            position: relative;
        }
        .sidebar {
            width: 260px;
            background-color: #fff;
            padding: 20px;
            border-right: 2px solid #388e3c;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        .sidebar h2 {
            color: #388e3c;
            text-align: center;
        }
        .sidebar button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            background-color: #388e3c;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
            text-align: left;
            font-weight: bold;
        }
        .sidebar button:hover {
            background-color: #2e7d32;
        }
        /* Submenu styling for Banking module */
        .submenu {
            display: none;
            padding-left: 15px;
            margin-bottom: 5px;
        }
        .submenu button {
            background-color: #4caf50;
            font-size: 0.9rem;
            font-weight: normal;
        }
        .submenu button:hover {
            background-color: #388e3c;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            background-color: #fff;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .content h2 {
            color: #388e3c;
        }
        .footer {
            text-align: center;
            font-size: 0.9rem;
            color: #555;
            padding: 10px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border: 2px solid #388e3c;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #4caf50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .form-group {
            margin: 10px 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .error {
            color: red;
            font-size: 0.8rem;
        }
        .submission-result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #388e3c;
            background-color: #e8f5e9;
            border-radius: 5px;
        }
    </style>
    <script>
        function showContent(section) {
            const contentDiv = document.getElementById('contentDisplay');
            const submenu = document.getElementById('bankingSubmenu');

            // Hide banking submenu by default unless banking is clicked
            if (section !== 'banking-toggle') {
                // Keep it visible if a sub-banking item was clicked, handled below
            }

            switch (section) {
                case 'home':
                    contentDiv.innerHTML = `
                        <h2>Welcome to Our Website</h2>
                        <p>This is the home section. Explore features like the Web Table, Forms, or the new Banking Module!</p>
                    `;
                    break;
                case 'about':
                    contentDiv.innerHTML = `
                        <h2>About Us</h2>
                        <p>This is the about section. Here you can find information about us and our services[cite: 1].</p>
                    `;
                    break;
                case 'webtable':
                    contentDiv.innerHTML = `
                        <h2>Sample Web Table</h2>
                        <table id="dataTable">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Age</th>
                                    <th>Country</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td>John Doe</td><td>25</td><td>USA</td></tr>
                                <tr><td>Jane Smith</td><td>30</td><td>UK</td></tr>
                                <tr><td>Mike Ross</td><td>35</td><td>Canada</td></tr>
                                <tr><td>Ravi Patel</td><td>40</td><td>India</td></tr>
                            </tbody>
                        </table>
                    `;
                    break;
                case 'dropdown':
                    contentDiv.innerHTML = `
                        <h2>Dropdown Selection</h2>
                        <label for="dropdown">Select an Option:</label>
                        <select id="dropdown" onchange="showDropdownValue()">
                            <option value="">Choose...</option>
                            <option value="Option 1">Option 1</option>
                            <option value="Option 2">Option 2</option>
                            <option value="Option 3">Option 3</option>
                        </select>
                        <p id="dropdownValue">You selected: <strong></strong></p>
                    `;
                    break;
                case 'datepicker':
                    contentDiv.innerHTML = `
                        <h2>Date Picker</h2>
                        <label for="datePicker">Choose a Date:</label>
                        <input type="date" id="datePicker" onchange="showDateValue()">
                        <p id="dateValue">You selected: <strong></strong></p>
                    `;
                    break;
                case 'webform':
                    contentDiv.innerHTML = `
                        <h2>Web Form</h2>
                        <form id="sampleForm">
                            <div class="form-group"><label for="fname">First Name:</label><input type="text" id="fname" name="fname" required></div>
                            <div class="form-group"><label for="lname">Last Name:</label><input type="text" id="lname" name="lname" required></div>
                            <div class="form-group"><label for="email">Email:</label><input type="email" id="email" name="email" required><span id="emailError" class="error"></span></div>
                            <div class="form-group"><label for="phone">Phone Number:</label><input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required><span id="phoneError" class="error"></span></div>
                            <div class="form-group"><label for="gender">Gender:</label>
                                <select id="gender" name="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Preferred Contact Method:</label>
                                <input type="radio" id="contactEmail" name="contactMethod" value="Email" required> <label for="contactEmail" style="display:inline;">Email</label><br>
                                <input type="radio" id="contactPhone" name="contactMethod" value="Phone" required> <label for="contactPhone" style="display:inline;">Phone</label><br>
                                <input type="radio" id="contactSMS" name="contactMethod" value="SMS" required> <label for="contactSMS" style="display:inline;">SMS</label>
                            </div>
                            <div class="form-group">
                                <input type="checkbox" id="subscribe" name="subscribe" style="width:auto;"> <label for="subscribe" style="display:inline;">Subscribe to Newsletter</label>
                            </div>
                            <div class="form-group"><input type="submit" value="Submit" style="background-color: #388e3c; color: white; border: none; padding: 10px; cursor: pointer;"></div>
                        </form>
                        <div id="submissionResult" class="submission-result" style="display: none;"></div>
                    `;
                    break;
                // --- BANKING MODULE SUB-SECTIONS ---
                case 'banking-summary':
                    contentDiv.innerHTML = `
                        <h2>Banking - Account Summary</h2>
                        <p>Welcome, <strong>Gregory</strong>. Here is your current account overview:</p>
                        <table>
                            <thead>
                                <tr><th>Account Number</th><th>Account Type</th><th>Balance</th><th>Status</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>****1092</td><td>Savings</td><td>$14,550.00</td><td>Active</td></tr>
                                <tr><td>****4421</td><td>Checking</td><td>$3,220.50</td><td>Active</td></tr>
                            </tbody>
                        </table>
                    `;
                    break;
                case 'banking-transfer':
                    contentDiv.innerHTML = `
                        <h2>Banking - Fund Transfer</h2>
                        <form id="transferForm" onsubmit="handleTransfer(event)">
                            <div class="form-group"><label for="fromAcc">From Account:</label>
                                <select id="fromAcc"><option value="Savings">Savings (****1092)</option><option value="Checking">Checking (****4421)</option></select>
                            </div>
                            <div class="form-group"><label for="toAccount">Beneficiary Account Number:</label><input type="text" id="toAccount" placeholder="Enter 10-digit account" required></div>
                            <div class="form-group"><label for="transferAmount">Amount ($):</label><input type="number" id="transferAmount" min="1" required></div>
                            <div class="form-group"><input type="submit" value="Transfer Funds" style="background-color: #388e3c; color: white; border: none; padding: 10px; cursor: pointer;"></div>
                        </form>
                        <div id="transferResult" class="submission-result" style="display: none;"></div>
                    `;
                    break;
                case 'banking-loan':
                    contentDiv.innerHTML = `
                        <h2>Banking - Loan Calculator</h2>
                        <div class="form-group"><label for="loanAmount">Loan Amount ($):</label><input type="number" id="loanAmount" value="10000"></div>
                        <div class="form-group"><label for="interestRate">Interest Rate (% p.a.):</label><input type="number" id="interestRate" value="5" step="0.1"></div>
                        <div class="form-group"><label for="loanTerm">Term (Years):</label><input type="number" id="loanTerm" value="3"></div>
                        <button onclick="calculateLoan()" style="background-color: #388e3c; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px;">Calculate EMI</button>
                        <div id="loanResult" class="submission-result" style="display: none;"></div>
                    `;
                    break;
                default:
                    contentDiv.innerHTML = '<h2>Welcome</h2><p>Select an option from the left to view the content.</p>';
            }
        }

        function toggleBankingMenu() {
            const submenu = document.getElementById('bankingSubmenu');
            submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
        }

        function showDropdownValue() {
            const selectedValue = document.getElementById('dropdown').value;
            document.getElementById('dropdownValue').innerHTML = `You selected: <strong>${selectedValue}</strong>`;
        }

        function showDateValue() {
            const selectedDate = document.getElementById('datePicker').value;
            document.getElementById('dateValue').innerHTML = `You selected: <strong>${selectedDate}</strong>`;
        }

        function handleTransfer(event) {
            event.preventDefault();
            const toAcc = document.getElementById('toAccount').value;
            const amount = document.getElementById('transferAmount').value;
            const resDiv = document.getElementById('transferResult');
            resDiv.style.display = 'block';
            resDiv.innerHTML = `<h3>Transfer Successful!</h3><p>Successfully transferred $${amount} to account ${toAcc}.</p>`;
        }

        function calculateLoan() {
            const p = parseFloat(document.getElementById('loanAmount').value);
            const r = parseFloat(document.getElementById('interestRate').value) / 12 / 100;
            const n = parseFloat(document.getElementById('loanTerm').value) * 12;
            
            const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            const resDiv = document.getElementById('loanResult');
            resDiv.style.display = 'block';
            resDiv.innerHTML = `<h3>Loan Estimation</h3><p>Monthly EMI: <strong>$${emi.toFixed(2)}</strong></p><p>Total Payment over ${n} months: <strong>$${(emi * n).toFixed(2)}</strong></p>`;
        }

        // Form submission handling for the web form
        document.addEventListener('submit', function (event) {
            if(event.target.id === 'sampleForm') {
                event.preventDefault();
                document.getElementById('emailError').textContent = '';
                document.getElementById('phoneError').textContent = '';

                const email = document.getElementById('email').value;
                const phone = document.getElementById('phone').value;
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const phonePattern = /^[0-9]{10}$/;

                let valid = true;
                if (!emailPattern.test(email)) {
                    document.getElementById('emailError').textContent = 'Please enter a valid email.';
                    valid = false;
                }
                if (!phonePattern.test(phone)) {
                    document.getElementById('phoneError').textContent = 'Please enter a valid 10-digit phone number.';
                    valid = false;
                }

                if (valid) {
                    const contactMethod = document.querySelector('input[name="contactMethod"]:checked').value;
                    const res = document.getElementById('submissionResult');
                    res.style.display = 'block';
                    res.innerHTML = `
                        <h3>Result:</h3>
                        <p>First Name: ${document.getElementById('fname').value}</p>
                        <p>Last Name: ${document.getElementById('lname').value}</p>
                        <p>Email: ${email}</p>
                        <p>Phone: ${phone}</p>
                        <p>Gender: ${document.getElementById('gender').value}</p>
                        <p>Preferred Contact Method: ${contactMethod}</p>
                        <p>Subscribed: ${document.getElementById('subscribe').checked ? 'Yes' : 'No'}</p>
                    `;
                }
            }
        });
    </script>
</head>
<body>

<div class="sidebar">
    <h2>Menu</h2>
    <button onclick="showContent('home')">Home</button>
    <button onclick="showContent('webtable')">Web Table</button>
    <button onclick="showContent('dropdown')">Dropdown</button>
    <button onclick="showContent('datepicker')">Date Picker</button>
    <button onclick="showContent('webform')">Web Form</button>
    
    <!-- Banking Module Dropdown/Toggle Button -->
    <button onclick="toggleBankingMenu()">Banking Module ▼</button>
    <div id="bankingSubmenu" class="submenu">
        <button onclick="showContent('banking-summary')">Account Summary</button>
        <button onclick="showContent('banking-transfer')">Fund Transfer</button>
        <button onclick="showContent('banking-loan')">Loan Calculator</button>
    </div>

    <button onclick="showContent('about')">About Us</button>
</div>

<div class="content">
    <div id="contentDisplay">
        <h2>Welcome</h2>
        <p>Select an option from the left to view the content.</p>
    </div>
</div>

<div class="footer">
    <p>&copy; 2026 For Demo Purpose ONLY. All Rights Reserved.</p>
</div>

</body>
</html>
