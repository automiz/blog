<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automiz Bank - NetBanking Login</title>
    <link rel="icon" href="https://automiz.github.io/blog/fav.png" type="image/png">
    <style>
        :root {
            --hdfc-blue: #004c8f;
            --hdfc-dark-blue: #003366;
            --hdfc-red: #d9232d;
            --bg-body: #f4f7f6;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #eef2f7, #cddc3922);
        }
        .bank-brand {
            margin-bottom: 20px;
            text-align: center;
        }
        .bank-brand h1 {
            color: var(--hdfc-blue);
            margin: 0;
            font-size: 1.8rem;
        }
        .bank-brand p {
            color: #666;
            font-size: 0.85rem;
            margin: 5px 0 0 0;
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 340px;
            border-top: 4px solid var(--hdfc-red);
        }
        .login-container h2 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: var(--hdfc-dark-blue);
            font-size: 1.3rem;
        }
        .login-container label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #444;
        }
        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .login-container button {
            width: 100%;
            padding: 11px;
            background-color: var(--hdfc-blue);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .login-container button:hover {
            background-color: var(--hdfc-dark-blue);
        }
        .error {
            color: var(--hdfc-red);
            margin-top: 10px;
            text-align: center;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="bank-brand">
        <h1>AUTOMIZ BANK</h1>
        <p>Secure Corporate & Retail NetBanking</p>
    </div>

    <div class="login-container">
        <h2>Login to NetBanking</h2>
        <form id="loginForm">
            <label for="username">User ID / Customer ID:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">IPIN / Password:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Secure Login</button>
        </form>
        <div class="error" id="errorMessage"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            if (username && password) {
                errorMessage.textContent = "Login successful! Redirecting...";
                errorMessage.style.color = "green";

                setTimeout(() => {
                    window.location.href = "https://automiz.github.io/blog/home.html";
                }, 1000);
            } else {
                errorMessage.textContent = "Please enter both User ID and Password.";
            }
        });
    </script>

</body>
</html>
